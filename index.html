<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase de Diseños</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&family=Merriweather:ital,wght@0,300;0,700;1,400&family=Outfit:wght@300;500;800&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        serif: ['Merriweather', 'serif'],
                        display: ['Outfit', 'sans-serif'],
                        architect: ['Architects Daughter', 'cursive'],
                        space: ['Space Grotesk', 'sans-serif'],
                        tahoma: ['Tahoma', 'Verdana', 'Segoe', 'sans-serif'],
                    },
                    colors: {
                        'terminal-black': '#0c0c0c',
                        'terminal-green': '#00ff41',
                        'blueprint-blue': '#0052cc',
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'scanline': 'scanline 8s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-100%)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Hide scrollbar but keep scroll functionality */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* CRT Effect */
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
        }

        @keyframes flicker {
            0% {
                opacity: 0.95;
            }

            50% {
                opacity: 0.92;
            }

            100% {
                opacity: 0.96;
            }
        }
    </style>
